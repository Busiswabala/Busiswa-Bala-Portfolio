name: Deploy portfolio

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "images/**"
      - "style/Stylesheet_Portfolio.css"
      - "vue js/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "vue js/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "vue js"

      - name: Build Vue portfolio
        run: npm run build
        working-directory: "vue js"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "vue js/dist"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4